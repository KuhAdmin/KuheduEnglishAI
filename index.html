<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover enables safe-area insets; user zoom stays enabled for accessibility. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kuhedu English AI</title>
    <meta name="description" content="Practise spoken English with a friendly AI tutor." />

    <!-- Updated at runtime to the active theme's background (shared/theme). -->
    <meta name="theme-color" content="#f8f8fd" />

    <!--
      Theme boot: applies the saved (or system-matched) named theme before first paint so there
      is no flash of the wrong theme. Keep ids/schemes in sync with src/shared/theme/themes.ts
      and the storage key with THEME_STORAGE_KEY (themes.test.ts checks this).
    -->
    <script>
      ;(function () {
        try {
          var schemes = {
            'indigo-dawn': 'light',
            'morning-bliss': 'light',
            'sage-dusk': 'dark',
            'midnight-iris': 'dark',
          }
          var saved = JSON.parse(localStorage.getItem('kuhedu-theme-v2') || 'null')
          var preference = saved && saved.state && saved.state.preference
          var id = schemes[preference]
            ? preference
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'midnight-iris'
              : 'indigo-dawn'
          document.documentElement.dataset.theme = id
          document.documentElement.dataset.scheme = schemes[id]
        } catch (e) {
          /* storage blocked: the default theme applies until the app loads */
        }
      })()
    </script>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kuhedu" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Kuhedu English AI needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
